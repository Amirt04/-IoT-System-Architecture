# Lab 5 — брокер для конвейера телеметрии
listener 1883
# учебный стенд; аутентификация и ACL разобраны в Lab 4
allow_anonymous true
persistence false
# $SYS раз в секунду — runner считает байты, сообщения, очередь
sys_interval 1
max_connections -1
# окно QoS1 к подписчику задаёт сам клиент (Receive Maximum, MQTT 5)
max_inflight_messages 0
# буфер брокера на сессию ingest; сверх — dropped
max_queued_messages 100000
max_queued_bytes 0
log_type error
log_type warning
