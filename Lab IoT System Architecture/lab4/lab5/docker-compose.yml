name: lab5

# [simulator × N] ──MQTT──► [mosquitto] ──► [ingest (asyncio): validate → enrich → batch]
#                                                   │
#                                    [очередь записи] ──► [SQLite /data/telemetry.db]
#                                                   │
#                                    [/metrics] ──► [Prometheus :9090]

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: lab5-mosquitto
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ulimits:
      nofile: {soft: 65536, hard: 65536}

  ingest:
    build: ./ingest
    container_name: lab5-ingest
    environment:
      BROKER: mosquitto
      MODE: none              # none | inflight | throttle  (меняется на лету через POST /config)
      MAX_BATCH_SIZE: "500"
      MAX_DELAY: "2.0"
      INFLIGHT: "1000"
    ports: ["8000:8000"]
    volumes:
      - ingest_data:/data
    cpus: 1.0                 # сервис приёма ограничен одним ядром — как небольшой edge-сервер
    mem_limit: 768m
    restart: unless-stopped
    depends_on: [mosquitto]

  prometheus:
    image: prom/prometheus:v2.53.4
    container_name: lab5-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [ingest]

  loadgen:
    build: ./loadgen
    container_name: lab5-loadgen
    environment:
      BROKER: mosquitto
      INGEST: http://ingest:8000
      RESULTS: /results
    volumes:
      - ./results:/results
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    depends_on: [ingest]

  # Захват трафика для Wireshark (по требованию):  docker compose run --rm capture
  capture:
    image: nicolaka/netshoot:v0.13
    profiles: ["capture"]
    network_mode: "service:mosquitto"
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./captures:/captures
    command: ["timeout", "30", "tcpdump", "-i", "eth0", "-s", "256", "-w", "/captures/lab5_mqtt.pcap", "tcp port 1883"]

volumes:
  ingest_data:
