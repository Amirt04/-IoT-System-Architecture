# ===================== Брокер A (edge / площадка) — production-like конфигурация =====================
per_listener_settings false

listener 1883 0.0.0.0
protocol mqtt

# ---------- 1. Аутентификация: анонимы запрещены, пользователи из password_file (mosquitto_passwd, PBKDF2-SHA512)
allow_anonymous false
password_file /mosquitto/secrets/passwd_a

# ---------- 2. Авторизация: ACL по схеме топиков
acl_file /mosquitto/secrets/acl_a

# ---------- 3. Persistence: сессии, подписки, очереди QoS 1/2 и retained переживают рестарт
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
# persistent-сессии отключённых клиентов живут не дольше 7 дней (иначе копятся бесконечно)
persistent_client_expiration 7d

# ---------- 4. Лимиты
# неподтверждённых QoS 1/2 сообщений к одному клиенту одновременно
max_inflight_messages 20
# очередь на клиента (офлайн или медленный); сверх лимита сообщения отбрасываются
max_queued_messages 100
# максимальный размер payload, байт: защита от «толстых» сообщений
message_size_limit 1024
max_connections -1
max_keepalive 300

# ---------- 6. Метрики $SYS публикуются каждые 5 с
sys_interval 5

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---------- 5. Мост A -> B
connection bridge-to-b
address broker-b:1883
bridge_protocol_version mqttv311
remote_clientid bridge-a-to-b
remote_username bridge-a
remote_password Bridge-Pass!
cleansession false
# брокеры-mosquitto помечают мостовые соединения и не возвращают сообщение туда, откуда оно пришло
try_private true
notifications true
keepalive_interval 30
restart_timeout 5 30
# topic <шаблон> <направление out|in|both> <QoS>
topic iot/v1/+/+/telemetry/#             out          1
topic iot/v1/+/+/status                  out          1
topic iot/v1/+/+/cmd/#                   in           1
topic bridge/test/#                      both         1
