# ===================== Брокер B (облако / центр) =====================
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/secrets/passwd_b
acl_file /mosquitto/secrets/acl_b
persistence true
persistence_location /mosquitto/data/
max_queued_messages 1000
sys_interval 5
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
