name: lab0

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [iot]

  iot-simulator:
    build: ./simulator
    container_name: iot-simulator
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DEVICE_ID: sensor-01
      PUBLISH_INTERVAL: "5"
      MQTT_QOS: "1"
      MQTT_CLEAN_SESSION: "false"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks: [iot]

volumes:
  mosquitto_data:
  mosquitto_log:

networks:
  iot:
    name: lab0-net
