# ---------- Listener ----------
listener 1883 0.0.0.0
allow_anonymous true          # только для учебного стенда!

# ---------- Persistence ----------
persistence true
persistence_location /mosquitto/data/
autosave_interval 30          # сохранять БД в памяти на диск каждые 30 с

# ---------- Logging ----------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type all                  # error, warning, notice, information, subscribe, unsubscribe, debug
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
