# Lab 3: брокер для экспериментов QoS / retained / LWT
listener 1883 0.0.0.0
allow_anonymous true

# persistent-сессии (clean_session=false) и retained-сообщения
persistence true
persistence_location /mosquitto/data/

# очередь для подписчика при обрывах: по умолчанию 1000 — мало для 1000 сообщений QoS 1/2 под потерями
max_queued_messages 100000
# 0 = без лимита окна неподтверждённых сообщений к подписчику.
# При значении 20 (по умолчанию) mosquitto 2.0.x после переподключения подписчика
# под потерями «залипал» на QoS 2: слоты окна не освобождались, доставка вставала навсегда.
max_inflight_messages 0

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
