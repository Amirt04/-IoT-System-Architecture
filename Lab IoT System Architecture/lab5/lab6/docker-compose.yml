name: lab6

# [lab: генератор/загрузчик, бенчмарки] ──► [PostgreSQL 16 + TimescaleDB]
#                                              │ hypertable, compression, CAGG, retention
#                                              ├──► [continuous aggregates: 1m / 1h / 1d]
#                                              ├──► [MinIO: cold tier, Parquet]
#                                              └──► [Grafana :3000]

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: lab6-timescaledb
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iot
      TS_TUNE_MEMORY: 2GB          # timescaledb-tune подбирает shared_buffers, work_mem и т.д. под 2 ГБ
      TS_TUNE_NUM_CPUS: "2"
    ports: ["5433:5432"]           # 5433 на ПК, чтобы не конфликтовать с локальным PostgreSQL
    shm_size: 1g
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/100_lab6_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot"]
      interval: 5s
      retries: 30

  minio:
    # minio/minio удалён с Docker Hub (сентябрь 2026) — сборка MinIO от Chainguard (бесплатно доступен только latest)
    image: cgr.dev/chainguard/minio:latest
    container_name: lab6-minio
    user: "0:0"                    # образ по умолчанию работает от uid 65532, а том создаётся от root
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ["9000:9000", "9001:9001"]   # 9001 — веб-консоль MinIO
    volumes:
      - minio_data:/data

  grafana:
    image: grafana/grafana:11.3.1
    container_name: lab6-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lab6.json
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [timescaledb]

  lab:
    build: ./lab
    container_name: lab6-lab
    environment:
      PG_DSN: host=timescaledb port=5432 dbname=iot user=postgres password=postgres
      MINIO_ENDPOINT: minio:9000
      RESULTS: /results
    volumes:
      - ./results:/results
    depends_on:
      timescaledb: {condition: service_healthy}
      minio: {condition: service_started}

volumes:
  tsdb_data:
  minio_data:
