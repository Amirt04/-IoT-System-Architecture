# Lab 2: обычный и TLS-listener, чтобы измерить вклад TLS во время подключения
listener 1883 0.0.0.0
allow_anonymous true

listener 8883 0.0.0.0
cafile   /certs/ca.crt
certfile /certs/server.crt
keyfile  /certs/server.key
allow_anonymous true

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
